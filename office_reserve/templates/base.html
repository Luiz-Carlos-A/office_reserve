<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- CONFIGURAÇÕES BÁSICAS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Office Reserve{% endblock %}</title>

    {% load static %}

    <!-- BOOTSTRAP (layout e responsividade) -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <!-- ÍCONES (Google Material Icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <!-- CSS PRINCIPAL DO PROJETO -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- ESTILOS ESPECÍFICOS DA NAVBAR -->
    <style>
        body {
            min-height: 100vh;
        }

        /* NAVBAR TRANSPARENTE COM BLUR */
        .custom-navbar {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* LOGO */
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: bold;
            color: white !important;
        }

        /* LINKS DA NAVBAR */
        .nav-btn {
            color: #ddd !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-btn:hover {
            color: #4facfe !important;
            transform: translateY(-1px);
        }

        /* BOTÃO SAIR */
        .btn-danger {
            border-radius: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>

<body>

<!-- 🔝 NAVBAR PRINCIPAL -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container">

    <!-- LOGO / HOME -->
    <a class="navbar-brand" href="{% url 'home' %}">
        Office Reserve
    </a>

    <!-- BOTÃO MOBILE -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- ITENS -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-3">

        {% if user.is_authenticated %}

          <!-- MAPA -->
          <li class="nav-item">
            <a class="nav-link nav-btn d-flex align-items-center gap-1" href="{% url 'mapa' %}">
                <span class="material-symbols-outlined">map</span>
                Mapa
            </a>
          </li>

          <!-- LOGOUT -->
          <li class="nav-item">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm px-3 d-flex align-items-center gap-1">
                    <span class="material-symbols-outlined">logout</span>
                    Sair
                </button>
            </form>
          </li>

        {% else %}

          <!-- LOGIN -->
          <li class="nav-item">
            <a class="nav-link nav-btn" href="{% url 'login' %}">
                Entrar
            </a>
          </li>

        {% endif %}

      </ul>
    </div>

  </div>
</nav>

<!-- CONTEÚDO DINÂMICO -->
<div class="container-fluid p-0">
    {% block content %}
    {% endblock %}
</div>

<!-- ===================== -->
<!-- 🔐 SCRIPTS UTILITÁRIOS -->
<!-- ===================== -->

<script>
/* MOSTRAR / ESCONDER SENHA (LOGIN) */
function togglePassword(element) {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
        element.textContent = "visibility_off";
    } else {
        password.type = "password";
        element.textContent = "visibility";
    }
}

/* MOSTRAR / ESCONDER SENHA (CADASTRO) */
function togglePasswordCadastro(id, element) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.textContent = "visibility_off";
    } else {
        input.type = "password";
        element.textContent = "visibility";
    }
}
</script>

<script>
/* VALIDAÇÃO DE SENHA NO CADASTRO */
function validarSenha() {
    const senha1 = document.getElementById("senha1").value;
    const senha2 = document.getElementById("senha2").value;

    if (senha1 !== senha2) {
        alert("As senhas não coincidem!");
        return false;
    }

    return true;
}
</script>

</body>
</html>
